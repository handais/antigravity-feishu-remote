<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <style>
    .font-sans {
      font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    @keyframes flowForward {
      from { stroke-dashoffset: 48; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes flowBackward {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 48; }
    }
    @keyframes pulseBorder {
      0%, 100% { stroke-opacity: 0.35; }
      50% { stroke-opacity: 0.8; }
    }
    .edge-fwd { stroke-dasharray: 8 8; animation: flowForward 1.8s linear infinite; }
    .edge-rev { stroke-dasharray: 6 10; animation: flowBackward 2.2s linear infinite; }
    .ws-glow { animation: pulseBorder 2.6s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#060B18"/>
      <stop offset="50%" stop-color="#0C1429"/>
      <stop offset="100%" stop-color="#0A1022"/>
    </linearGradient>
    <linearGradient id="secBarBg" x1="36" y1="286" x2="1164" y2="332" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="archGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#64748B" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <!-- Container -->
  <rect width="1200" height="360" rx="18" fill="url(#archBg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#archGrid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="17.5" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Top header -->
  <text x="36" y="42" class="font-mono" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#38BDF8">ARCHITECTURE &amp; SECURITY ISOLATION</text>
  <text x="360" y="42" class="font-sans" font-size="13.5" font-weight="600" fill="#94A3B8">工作原理与本地零泄密隔离</text>

  <!-- Node 1: Feishu -->
  <rect x="36" y="72" width="244" height="194" rx="14" fill="#0F172A" fill-opacity="0.88" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.4"/>
  <rect x="52" y="88" width="84" height="24" rx="12" fill="#38BDF8" fill-opacity="0.14"/>
  <text x="94" y="104" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#7DD3FC">FEISHU / LARK</text>
  <text x="52" y="142" class="font-sans" font-size="18" font-weight="700" fill="#F8FAFC">📱 手机 / 桌面飞书</text>
  <text x="52" y="172" class="font-sans" font-size="13" fill="#CBD5E1">• 私聊白名单 &amp; 话题群并发</text>
  <text x="52" y="196" class="font-sans" font-size="13" fill="#CBD5E1">• CardKit 2.0 打字机流式卡</text>
  <text x="52" y="220" class="font-sans" font-size="13" fill="#CBD5E1">• 面板按钮 · 图片/语音/文件</text>
  <text x="52" y="244" class="font-sans" font-size="13" fill="#CBD5E1">• 云文档 &amp; 飞书任务中心</text>

  <!-- Connector 1 -> 2 -->
  <line x1="280" y1="154" x2="326" y2="154" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2"/>
  <line class="edge-fwd" x1="280" y1="154" x2="326" y2="154" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="280" y1="184" x2="326" y2="184" stroke="#818CF8" stroke-opacity="0.25" stroke-width="2"/>
  <line class="edge-rev" x1="280" y1="184" x2="326" y2="184" stroke="#818CF8" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Node 2: WebSocket Tunnel -->
  <rect class="ws-glow" x="326" y="72" width="218" height="194" rx="14" fill="#0B152B" fill-opacity="0.92" stroke="#00D6B9" stroke-width="1.5"/>
  <rect x="342" y="88" width="96" height="24" rx="12" fill="#00D6B9" fill-opacity="0.16"/>
  <text x="390" y="104" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#2DD4BF">WSS CHANNEL</text>
  <text x="342" y="142" class="font-sans" font-size="18" font-weight="700" fill="#F8FAFC">⚡ 加密长连接</text>
  <text x="342" y="172" class="font-sans" font-size="13" fill="#CBD5E1">• 无需公网 IP / 域名</text>
  <text x="342" y="196" class="font-sans" font-size="13" fill="#CBD5E1">• 无需内网穿透与 Webhook</text>
  <text x="342" y="220" class="font-sans" font-size="13" fill="#CBD5E1">• 自动剥离本地 SOCKS5</text>
  <text x="342" y="244" class="font-sans" font-size="13" fill="#CBD5E1">• 断网 / 休眠自动重连</text>

  <!-- Connector 2 -> 3 -->
  <line x1="544" y1="154" x2="590" y2="154" stroke="#00D6B9" stroke-opacity="0.25" stroke-width="2"/>
  <line class="edge-fwd" x1="544" y1="154" x2="590" y2="154" stroke="#00D6B9" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="544" y1="184" x2="590" y2="184" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2"/>
  <line class="edge-rev" x1="544" y1="184" x2="590" y2="184" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Node 3: Bridge Daemon + MCP + Hooks -->
  <rect x="590" y="72" width="280" height="194" rx="14" fill="#0F172A" fill-opacity="0.88" stroke="#6366F1" stroke-opacity="0.42" stroke-width="1.4"/>
  <rect x="606" y="88" width="132" height="24" rx="12" fill="#6366F1" fill-opacity="0.18"/>
  <text x="672" y="104" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#A5B4FC">LOCAL BRIDGE + HOOKS</text>
  <text x="606" y="142" class="font-sans" font-size="18" font-weight="700" fill="#F8FAFC">🧩 守护进程与安全网关</text>
  <text x="606" y="172" class="font-sans" font-size="13" fill="#CBD5E1">• launchd / systemd 开机常驻</text>
  <text x="606" y="196" class="font-sans" font-size="13" fill="#CBD5E1">• PreToolUse 高危命令审批拦截</text>
  <text x="606" y="220" class="font-sans" font-size="13" fill="#CBD5E1">• Stop 离开感应 + MCP 主动推送</text>
  <text x="606" y="244" class="font-sans" font-size="13" fill="#CBD5E1">• 手机自迭代 · 双检热更 + 回滚</text>

  <!-- Connector 3 -> 4 -->
  <line x1="870" y1="154" x2="916" y2="154" stroke="#A855F7" stroke-opacity="0.25" stroke-width="2"/>
  <line class="edge-fwd" x1="870" y1="154" x2="916" y2="154" stroke="#818CF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="870" y1="184" x2="916" y2="184" stroke="#34D399" stroke-opacity="0.25" stroke-width="2"/>
  <line class="edge-rev" x1="870" y1="184" x2="916" y2="184" stroke="#34D399" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Node 4: Local Antigravity -->
  <rect x="916" y="72" width="248" height="194" rx="14" fill="#0F172A" fill-opacity="0.88" stroke="#10B981" stroke-opacity="0.38" stroke-width="1.4"/>
  <rect x="932" y="88" width="112" height="24" rx="12" fill="#10B981" fill-opacity="0.16"/>
  <text x="988" y="104" text-anchor="middle" class="font-mono" font-size="11" font-weight="700" fill="#6EE7B7">LOCAL WORKSPACE</text>
  <text x="932" y="142" class="font-sans" font-size="18" font-weight="700" fill="#F8FAFC">🤖 本机 Antigravity</text>
  <text x="932" y="172" class="font-sans" font-size="13" fill="#CBD5E1">• stream-json 多轮会话接续</text>
  <text x="932" y="196" class="font-sans" font-size="13" fill="#CBD5E1">• 读写代码 · Diff · Skills 调用</text>
  <text x="932" y="220" class="font-sans" font-size="13" fill="#CBD5E1">• 30m 临时全权到期自动降权</text>
  <text x="932" y="244" class="font-sans" font-size="13" fill="#CBD5E1">• 电脑⇄手机会话接力 (/handoff)</text>

  <!-- Bottom Security Isolation Banner -->
  <rect x="36" y="286" width="1128" height="48" rx="12" fill="url(#secBarBg)" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.2"/>
  <text x="600" y="315" text-anchor="middle" class="font-sans" font-size="14" font-weight="600" fill="#D1FAE5">
    🔒 零泄密隔离：个人 App Secret 与白名单严格存于 ~/.config/antigravity-feishu/ (0600) · 插件仓库零密钥 · 仅放行授权 open_id
  </text>
</svg>
