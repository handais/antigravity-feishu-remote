<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none">
  <style>
    .font-sans {
      font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }
    @keyframes auroraFloatA {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.55; }
      50% { transform: translate(26px, -14px) scale(1.08); opacity: 0.85; }
    }
    @keyframes auroraFloatB {
      0%, 100% { transform: translate(0px, 0px) scale(1); opacity: 0.45; }
      50% { transform: translate(-22px, 16px) scale(1.1); opacity: 0.75; }
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.82); }
    }
    @keyframes ringExpand {
      0% { transform: scale(0.88); opacity: 0.7; }
      75%, 100% { transform: scale(1.22); opacity: 0; }
    }
    @keyframes dashFlow {
      from { stroke-dashoffset: 64; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes dashFlowRev {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 64; }
    }
    @keyframes packetSlide {
      0% { transform: translateX(0px); opacity: 0; }
      15% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateX(132px); opacity: 0; }
    }
    .orb-a { transform-origin: 260px 80px; animation: auroraFloatA 9s ease-in-out infinite; }
    .orb-b { transform-origin: 960px 230px; animation: auroraFloatB 11s ease-in-out infinite; }
    .live-dot { transform-origin: 851px 74px; animation: pulseDot 2s ease-in-out infinite; }
    .logo-ring { transform-origin: 98px 94px; animation: ringExpand 3.2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite; }
    .flow-line { stroke-dasharray: 8 8; animation: dashFlow 2.2s linear infinite; }
    .flow-line-rev { stroke-dasharray: 6 10; animation: dashFlowRev 2.8s linear infinite; }
    .packet { animation: packetSlide 2.2s ease-in-out infinite; }
  </style>

  <defs>
    <linearGradient id="stageBg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="52%" stop-color="#0B1328"/>
      <stop offset="100%" stop-color="#111A36"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D6B9" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#00D6B9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D6B9"/>
      <stop offset="55%" stop-color="#1490FF"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="160" y1="60" x2="540" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#7DD3FC"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D6B9" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00D6B9" stop-opacity="0.65"/>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94A3B8" fill-opacity="0.14"/>
    </pattern>
    <clipPath id="stageClip">
      <rect width="1200" height="320" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#stageClip)">
    <!-- Deep obsidian stage -->
    <rect width="1200" height="320" fill="url(#stageBg)"/>
    <rect width="1200" height="320" fill="url(#dotGrid)"/>

    <!-- Breathing aurora spotlights -->
    <ellipse class="orb-a" cx="250" cy="70" rx="340" ry="190" fill="url(#glowTeal)"/>
    <ellipse class="orb-b" cx="960" cy="240" rx="360" ry="210" fill="url(#glowBlue)"/>

    <!-- Subtle top specular rim -->
    <rect x="0" y="0" width="1200" height="2" fill="url(#rimGrad)"/>

    <!-- Brand emblem + animated signal ring -->
    <circle class="logo-ring" cx="98" cy="94" r="46" stroke="#00E5C3" stroke-opacity="0.45" stroke-width="1.5"/>
    <g transform="translate(56, 52)">
      <path d="M20 8H64C71.732 8 78 14.268 78 22V56C78 63.732 71.732 70 64 70H35L21 79.5C19.6 80.45 17.7 79.45 17.7 77.75V70H20C12.268 70 6 63.732 6 56V22C6 14.268 12.268 8 20 8Z" fill="url(#brandGrad)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="16" y="18" width="52" height="40" rx="9" fill="#091022" fill-opacity="0.9"/>
      <path d="M25 30L35 38L25 46" stroke="#00E5C3" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M39 46H51" stroke="#E2E8F0" stroke-width="4.2" stroke-linecap="round"/>
      <circle cx="57" cy="29" r="3.8" fill="#38BDF8"/>
      <path d="M52 23.5C55.4 21.3 59.8 21.7 62.6 24.5" stroke="#7DD3FC" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <!-- Title + evergreen PLUGIN pill -->
    <text x="160" y="96" class="font-sans" font-size="44" font-weight="800" letter-spacing="-0.8" fill="url(#titleGrad)">Feishu Remote</text>
    <rect x="492" y="64" width="82" height="28" rx="14" fill="#00D6B9" fill-opacity="0.14" stroke="#00D6B9" stroke-opacity="0.55" stroke-width="1.2"/>
    <text x="533" y="83" text-anchor="middle" class="font-mono" font-size="13" font-weight="700" fill="#2DD4BF">PLUGIN</text>

    <!-- Main Chinese tagline + English subline -->
    <text x="160" y="136" class="font-sans" font-size="21" font-weight="600" fill="#E2E8F0">随时随地，在手机飞书里远程驾驭本机 Antigravity</text>
    <text x="56" y="186" class="font-mono" font-size="13.5" fill="#94A3B8">WebSocket  ·  CardKit 2.0  ·  Session Handoff  ·  Self-Updating  ·  Zero Public IP</text>

    <!-- 4 feature chips -->
    <g transform="translate(56, 222)">
      <rect x="0" y="0" width="174" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="87" y="25" text-anchor="middle" class="font-sans" font-size="13.5" font-weight="600" fill="#E2E8F0">✨ 流式卡片 · 多话题</text>

      <rect x="186" y="0" width="166" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="269" y="25" text-anchor="middle" class="font-sans" font-size="13.5" font-weight="600" fill="#E2E8F0">🔄 电脑⇄手机接力</text>

      <rect x="364" y="0" width="156" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="442" y="25" text-anchor="middle" class="font-sans" font-size="13.5" font-weight="600" fill="#E2E8F0">🛡️ 高危命令审批</text>

      <rect x="532" y="0" width="174" height="40" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <text x="619" y="25" text-anchor="middle" class="font-sans" font-size="13.5" font-weight="600" fill="#E2E8F0">🚀 手机自迭代热更</text>
    </g>

    <!-- Right telemetry glass card -->
    <rect x="816" y="42" width="332" height="236" rx="16" fill="#0B1224" fill-opacity="0.78" stroke="#38BDF8" stroke-opacity="0.26" stroke-width="1.2"/>

    <!-- Telemetry header -->
    <circle class="live-dot" cx="851" cy="74" r="5" fill="#10B981"/>
    <text x="866" y="79" class="font-mono" font-size="12" font-weight="700" fill="#34D399">WSS BRIDGE · ONLINE</text>
    <rect x="1058" y="61" width="68" height="24" rx="12" fill="#1E293B" stroke="#475569" stroke-opacity="0.6"/>
    <text x="1092" y="77" text-anchor="middle" class="font-mono" font-size="11" fill="#CBD5E1">TLS 1.3</text>

    <!-- Phone to Mac animated bridge -->
    <rect x="840" y="106" width="70" height="72" rx="12" fill="#131F3D" stroke="#38BDF8" stroke-opacity="0.38"/>
    <rect x="866" y="116" width="18" height="28" rx="3.5" fill="#0B1224" stroke="#38BDF8" stroke-width="1.8"/>
    <line x1="872" y1="140" x2="878" y2="140" stroke="#7DD3FC" stroke-width="1.6" stroke-linecap="round"/>
    <text x="875" y="164" text-anchor="middle" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">飞书手机端</text>

    <rect x="1054" y="106" width="70" height="72" rx="12" fill="#131F3D" stroke="#00D6B9" stroke-opacity="0.4"/>
    <rect x="1074" y="118" width="30" height="20" rx="3" fill="#0B1224" stroke="#00E5C3" stroke-width="1.8"/>
    <path d="M1070 142H1108" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round"/>
    <text x="1089" y="164" text-anchor="middle" class="font-mono" font-size="11.5" font-weight="600" fill="#E2E8F0">agy CLI</text>

    <!-- Animated flow lines -->
    <line x1="914" y1="132" x2="1050" y2="132" stroke="#38BDF8" stroke-opacity="0.32" stroke-width="2"/>
    <line class="flow-line" x1="914" y1="132" x2="1050" y2="132" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round"/>
    <circle class="packet" cx="916" cy="132" r="3.6" fill="#00E5C3"/>

    <line x1="914" y1="152" x2="1050" y2="152" stroke="#6366F1" stroke-opacity="0.28" stroke-width="1.6"/>
    <line class="flow-line-rev" x1="914" y1="152" x2="1050" y2="152" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Bottom telemetry specs -->
    <rect x="840" y="196" width="136" height="58" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="908" y="218" text-anchor="middle" class="font-sans" font-size="11.5" fill="#94A3B8">凭证隔离存储</text>
    <text x="908" y="239" text-anchor="middle" class="font-mono" font-size="12" font-weight="700" fill="#38BDF8">~/.config · 0600</text>

    <rect x="988" y="196" width="136" height="58" rx="10" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.09"/>
    <text x="1056" y="218" text-anchor="middle" class="font-sans" font-size="11.5" fill="#94A3B8">手机自迭代热更</text>
    <text x="1056" y="239" text-anchor="middle" class="font-sans" font-size="12" font-weight="700" fill="#34D399">双检 + 快照回滚</text>
  </g>

  <!-- Outer subtle border -->
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="19.5" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>
