name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fec0e899148db2dbf # v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run syntax & export preflight check
        run: node scripts/cli.mjs check

      - name: Run isolated smoke tests
        run: node scripts/smoke-test.mjs

      - name: Run modular regression test suite
        run: node --test tests/*.test.mjs
